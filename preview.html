<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Same policy as index.html, and for the same reasons:
     img-src    fdfile: for images, data: for the fallback file icon
     media-src  fdfile: for video and audio
     object-src fdfile: for the <embed> element itself
     frame-src  fdfile: because Chromium's PDF viewer loads in a nested
                browsing context — object-src alone is NOT enough, and
                without this the PDF silently renders blank. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src fdfile: data:; media-src fdfile:; object-src fdfile:; frame-src fdfile:;" />
<title>Preview</title>
<style>
  /* Same custom properties as the panel — this is the same surface. */
  :root {
    --bg: rgba(22, 22, 26, 0.94);
    --stroke: rgba(255, 255, 255, 0.10);
    --hairline: rgba(255, 255, 255, 0.07);
    --text: #ECECEF;
    --muted: #83838E;
    --faint: #5E5E68;
    --accent: #7EE0B0;
    --hover: rgba(255, 255, 255, 0.06);
    --scale: 1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text);
    cursor: default;
    user-select: none;
  }

  .panel {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    overflow: hidden;
  }

  /* The only drag region. Nothing below it may become one. */
  header {
    -webkit-app-region: drag;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 38px;
    padding: 0 8px 0 14px;
    border-bottom: 1px solid var(--hairline);
  }

  .name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: calc(12px * var(--scale));
    font-weight: 600;
  }

  .meta {
    flex: 0 0 auto;
    font-size: calc(11px * var(--scale));
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }

  .icon-btn {
    -webkit-app-region: no-drag;
    flex: 0 0 auto;
    width: 22px; height: 22px;
    display: grid; place-items: center;
    border: 0; border-radius: 6px;
    background: transparent;
    color: var(--faint);
    cursor: default;
    transition: background 120ms ease, color 120ms ease;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .icon-btn svg { width: 11px; height: 11px; }

  .body {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    overflow: auto;
  }
  .body.kind-text { flex-direction: column; }
  .body::-webkit-scrollbar { width: 8px; height: 8px; }
  .body::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.10);
    border-radius: 4px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  .body::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.20);
    background-clip: content-box;
  }

  /* Scaled to fit, never enlarged past natural size. */
  .preview-image {
    margin: auto;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .preview-frame {
    flex: 1 1 auto;
    border: 0;
    width: 100%;
    height: 100%;
  }

  .preview-text {
    flex: 1 1 auto;
    margin: 0;
    padding: 12px 16px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: calc(11px * var(--scale));
    line-height: 1.45;
    color: var(--text);
    white-space: pre;
    user-select: text;
  }

  .preview-truncated {
    flex: 0 0 auto;
    padding: 6px 16px;
    border-top: 1px solid var(--hairline);
    font-size: calc(11px * var(--scale));
    color: var(--faint);
  }

  .preview-media {
    margin: auto;
    max-width: 100%;
    max-height: 100%;
  }
  .preview-media[data-audio] { width: 70%; }

  /* ── Folder card ───────────────────────────────────────── */

  .body.kind-folder { flex-direction: column; }

  .folder-card {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px 20px;
    overflow-y: auto;
  }

  .folder-stats {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 14px;
    font-size: calc(12px * var(--scale));
  }
  .folder-stats dt { color: var(--faint); }
  .folder-stats dd { font-variant-numeric: tabular-nums; }

  .folder-heading {
    font-size: calc(10px * var(--scale));
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--muted);
    padding-top: 4px;
    border-top: 1px solid var(--hairline);
  }

  .folder-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }

  .folder-entry {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 3px 0;
    font-size: calc(12px * var(--scale));
    min-width: 0;
  }
  .folder-entry-icon {
    flex: 0 0 auto;
    width: 14px; height: 14px;
    display: grid; place-items: center;
    color: var(--faint);
  }
  .folder-entry-icon svg { width: 13px; height: 13px; }
  .folder-entry-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .preview-fallback {
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 24px;
    text-align: center;
  }
  .preview-fallback img { width: 48px; height: 48px; }
  .fallback-name { font-size: calc(13px * var(--scale)); word-break: break-word; }
  .fallback-meta {
    font-size: calc(11px * var(--scale));
    color: var(--faint);
    line-height: 1.6;
    white-space: pre-line;
  }
  .preview-open-btn {
    margin-top: 4px;
    border: 1px solid var(--stroke);
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: calc(11px * var(--scale));
    padding: 5px 12px;
    cursor: default;
    transition: background 120ms ease;
  }
  .preview-open-btn:hover { background: var(--hover); }
  .preview-open-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="panel">
    <header>
      <span class="name" id="name"></span>
      <span class="meta" id="meta"></span>
      <button class="icon-btn" id="close" aria-label="Close preview">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"/></svg>
      </button>
    </header>
    <div class="body" id="body"></div>
  </div>

  <script src="preview.js"></script>
</body>
</html>
