name: FloatingDownloads

options:
  bundleIdPrefix: com.merna
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Local development build: ad-hoc signing, no team required.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  FloatingDownloads:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: Sources

    dependencies:
      - package: KeyboardShortcuts

    # Info.plist is generated by XcodeGen from these properties.
    # LSUIElement: menu bar only, no Dock icon, no window on launch.
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleName: FloatingDownloads
        CFBundleDisplayName: FloatingDownloads
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHumanReadableCopyright: ""

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.merna.floatingdownloads
        # Hand-written and version-controlled, not generated. App Sandbox is
        # explicitly set to false inside it. See Supporting/FloatingDownloads.entitlements
        CODE_SIGN_ENTITLEMENTS: Supporting/FloatingDownloads.entitlements
        PRODUCT_NAME: FloatingDownloads
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
