<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- The panel itself renders no file content: previews live in preview.html,
     which carries its own widened policy. This stays as tight as it began. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';" />
<title>FloatingDownloads</title>
<style>
  /* Custom properties ported verbatim from floating-todo/index.html.
     Do not introduce new colour values here — everything below composes
     from these. */
  :root {
    --bg: rgba(22, 22, 26, 0.94);
    --stroke: rgba(255, 255, 255, 0.10);
    --hairline: rgba(255, 255, 255, 0.07);
    --text: #ECECEF;
    --muted: #83838E;
    --faint: #5E5E68;
    --accent: #7EE0B0;
    --hover: rgba(255, 255, 255, 0.06);
    --scale: 1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text);
    cursor: default;
    user-select: none;
  }

  .panel {
    position: relative; /* anchors the error toast */
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    overflow: hidden;
  }

  /* The ONLY app-region drag zone in the app. Phase 3 makes the file rows
     draggable, and a row inside a drag region cannot start an HTML5 drag —
     so nothing below this header may ever be given -webkit-app-region: drag.
     See context_v2.md, "Known gotchas". */
  header {
    -webkit-app-region: drag;
    flex: 0 0 auto;
    height: 46px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 10px 0 14px;
    border-bottom: 1px solid var(--hairline);
  }

  /* The header is an app-region drag zone, so the tabs MUST opt out or the
     clicks are swallowed by the window move. Same reason .controls does it
     in the reference app. */
  .tabs {
    display: flex;
    gap: 2px;
    -webkit-app-region: no-drag;
  }

  .tab {
    border: 0;
    background: transparent;
    font: inherit;
    font-size: calc(11px * var(--scale));
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 4px 8px;
    border-radius: 6px;
    cursor: default;
    transition: background 120ms ease, color 120ms ease;
  }
  .tab:hover { background: var(--hover); color: var(--text); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  /* Active reads brighter than hover and carries an accent underline, so the
     two states are never confusable. No new colour values. */
  .tab.active {
    color: var(--text);
    box-shadow: inset 0 -2px 0 0 var(--accent);
  }

  .count {
    font-size: calc(11px * var(--scale));
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }

  /* ── Columns ───────────────────────────────────────────── */

  /* The column strip scrolls horizontally; each column scrolls vertically
     on its own. The panel never widens itself when a column opens. */
  #columns {
    flex: 1 1 auto;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    min-height: 0;
  }

  /* grow:0 shrink:0 basis:240px — fixed width, and never compressed, which
     is what makes the strip scroll horizontally instead of squeezing. */
  .column {
    flex: 0 0 240px;
    list-style: none;
    overflow-y: auto;
    padding: 8px 6px 8px 8px;
    min-height: 0;
  }
  .column:not(:last-child) { border-right: 1px solid var(--hairline); }

  /* Only the rightmost column grows, absorbing any width the open columns
     do not use — otherwise a single 240px column leaves dead space in a
     wider panel. 240px stays the floor and shrink is still 0, so once the
     columns overflow this has no effect and scrolling behaves as before.
     Earlier columns keep their width, so nothing shifts under the cursor. */
  .column:last-child { flex: 1 0 240px; }

  .column-empty {
    padding: 10px 6px;
    font-size: calc(12px * var(--scale));
    color: var(--faint);
  }

  #columns::-webkit-scrollbar,
  .column::-webkit-scrollbar { width: 8px; height: 8px; }
  #columns::-webkit-scrollbar-thumb,
  .column::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.10);
    border-radius: 4px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  #columns::-webkit-scrollbar-thumb:hover,
  .column::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.20);
    background-clip: content-box;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 6px;
    border-left: 2px solid transparent;
    border-radius: 7px;
    transition: background 160ms ease;
  }
  .row:hover { background: var(--hover); }

  /* Selection must read as clearly stronger than hover. The accent left bar
     is the primary signal; the doubled tint is a second layer of the SAME
     --hover value painted over itself, so no new colour value is introduced. */
  .row.selected {
    background-color: var(--hover);
    background-image: linear-gradient(var(--hover), var(--hover));
    border-left-color: var(--accent);
  }
  .row.selected .icon,
  .row.selected .date { color: var(--text); }

  /* The trail through the columns: a folder in a parent column that opened
     the column to its right. Deliberately quieter than .selected — a single
     --hover tint and a --faint bar rather than the accent bar — so the
     active selection still reads as the strongest thing on screen. */
  .row.path {
    background-color: var(--hover);
    border-left-color: var(--faint);
  }
  .row.path.selected { border-left-color: var(--accent); }

  .icon {
    flex: 0 0 auto;
    width: 14px;
    height: 14px;
    display: grid;
    place-items: center;
    color: var(--faint);
  }
  .icon svg { width: 13px; height: 13px; }
  /* Folders read brighter than files, on top of the different glyph. */
  .row.is-dir .icon { color: var(--muted); }

  /* Middle truncation: the head shrinks and ellipsises, the tail (the file
     extension) never shrinks, so ".pdf" stays visible at any panel width. */
  .name {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    font-size: calc(13px * var(--scale));
    line-height: 1.35;
  }
  .name-head {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .name-tail {
    flex: 0 0 auto;
    white-space: nowrap;
  }

  .date {
    flex: 0 0 auto;
    font-size: calc(11px * var(--scale));
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }

  /* ── Metadata: tags, notes, pins ───────────────────────── */

  /* The row becomes two lines ONLY when it has tags, so untagged rows are
     unchanged and the list does not grow uniformly. */
  .row { flex-wrap: wrap; }
  .row-main {
    flex: 1 1 100%;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  /* Fixed 12px slots. Reserved always so names do not reflow as markers
     appear, and cheap enough at 240px. */
  .marker {
    flex: 0 0 auto;
    width: 12px; height: 12px;
    display: grid; place-items: center;
    border: 0; padding: 0;
    background: transparent;
    color: var(--faint);
    cursor: default;
    opacity: 0;
    transition: opacity 120ms ease, color 120ms ease;
  }
  .marker svg { width: 10px; height: 10px; }

  /* Note marker shows only when a note exists. */
  .row.has-note .note-marker { opacity: 1; color: var(--muted); }
  .note-marker:hover { color: var(--text); }

  /* Pin shows when pinned, and on hover so unpinned rows have a target too. */
  .row.is-pinned .pin-marker { opacity: 1; color: var(--accent); }
  .row:hover .pin-marker { opacity: 1; }
  .pin-marker:hover { color: var(--text); }

  .row.is-pinned { background-color: var(--hover); }

  /* Tag strip: second line, clipped rather than wrapped to a third. */
  .tags {
    flex: 1 1 100%;
    min-width: 0;
    display: flex;
    flex-wrap: nowrap;
    overflow: hidden;
    gap: 4px;
    padding-left: 23px; /* aligns under the filename, past the icon */
    margin-top: 3px;
  }

  /* Styled after floating-todo's URGENT pill: rounded, filled, uppercase.
     Colours are generated per tag name — the one place new colour values are
     allowed — and kept low-saturation so they sit inside the HUD. */
  .pill {
    flex: 0 0 auto;
    max-width: 72px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: calc(9px * var(--scale));
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .pill.more { color: var(--faint); background: var(--hover); }

  /* ── Popover ───────────────────────────────────────────── */

  .popover {
    position: absolute;
    z-index: 10;
    width: 240px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    border: 1px solid var(--stroke);
    border-radius: 10px;
    background: var(--bg);
    backdrop-filter: blur(28px) saturate(160%);
  }

  .popover-title {
    font-size: calc(10px * var(--scale));
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .popover textarea,
  .popover input {
    width: 100%;
    border: 1px solid var(--stroke);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: calc(12px * var(--scale));
    padding: 6px 7px;
    outline: none;
    user-select: text;
  }
  .popover textarea {
    min-height: 96px;
    resize: none;
    line-height: 1.45;
  }
  .popover textarea:focus,
  .popover input:focus { border-color: var(--accent); }

  .popover-hint {
    font-size: calc(10px * var(--scale));
    color: var(--faint);
  }

  /* ── Colour swatches ───────────────────────────────────── */

  .swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .swatch {
    width: 18px; height: 18px;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 0;
    cursor: default;
    transition: transform 100ms ease, border-color 100ms ease;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.selected { border-color: var(--text); }
  .swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Automatic reads as "no explicit choice" rather than as a tenth colour. */
  .swatch.auto {
    display: grid;
    place-items: center;
    background: transparent;
    border-color: var(--stroke);
    color: var(--faint);
    font-size: 9px;
    font-weight: 600;
  }
  .swatch.auto:hover { color: var(--text); }
  .swatch.auto.selected { border-color: var(--text); color: var(--text); }

  /* Existing tags inside the tag popover, each removable. */
  .tag-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 1px 4px 1px 5px;
    border-radius: 4px;
    font-size: calc(9px * var(--scale));
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .tag-chip button {
    border: 0; background: transparent; padding: 0;
    color: inherit; font: inherit; opacity: 0.7;
    cursor: default;
  }
  .tag-chip button:hover { opacity: 1; }

  /* ── Drop targets ──────────────────────────────────────── */
  /* Shown while files from another app are dragged over the panel, so it is
     obvious where they will land. Existing custom properties only. */

  .column.drop-target {
    background-color: var(--hover);
    box-shadow: inset 0 0 0 2px var(--accent);
  }

  /* A folder row wins over its column: the drop goes into the folder. */
  .row.drop-target {
    background-color: var(--hover);
    border-left-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  /* ── Name tooltip ──────────────────────────────────────── */
  /* Shown only when a filename is actually clipped. pointer-events: none is
     load-bearing — without it the tooltip would sit under the cursor and
     swallow dragstart, drop and contextmenu on the row beneath. */

  .tooltip {
    position: absolute;
    z-index: 20;
    pointer-events: none;
    max-width: 280px;
    padding: 5px 8px;
    border: 1px solid var(--stroke);
    border-radius: 6px;
    background: var(--bg);
    backdrop-filter: blur(28px) saturate(160%);
    color: var(--text);
    font-size: calc(11px * var(--scale));
    line-height: 1.4;
    white-space: pre-line;
    word-break: break-word;
  }

  /* ── Error toast ───────────────────────────────────────── */
  /* Copy failures must be visible, not swallowed. */

  .toast {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    padding: 8px 10px;
    border: 1px solid var(--stroke);
    border-radius: 8px;
    background: var(--bg);
    backdrop-filter: blur(28px) saturate(160%);
    color: var(--text);
    font-size: calc(11px * var(--scale));
    line-height: 1.45;
    white-space: pre-line;
    max-height: 40%;
    overflow-y: auto;
    user-select: text;
  }

  /* ── Empty and error states ────────────────────────────── */

  .message {
    flex: 1 1 auto;
    display: grid;
    place-items: center;
    padding: 0 26px;
    text-align: center;
    font-size: calc(12px * var(--scale));
    line-height: 1.5;
    color: var(--faint);
    white-space: pre-line; /* the permission message is multi-line */
  }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="panel">
    <header>
      <div class="tabs" id="tabs"></div>
      <span class="count" id="count"></span>
    </header>

    <div id="columns"></div>
    <p class="message" id="message" hidden></p>
    <div class="popover" id="popover" hidden></div>
    <div class="tooltip" id="tooltip" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
